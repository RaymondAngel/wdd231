<!doctype html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Week 3 JavaScript ES modules learning activity.">
  <meta name="author" content="Raymond Amande">
  <title>Modules Example: Course and Sections</title>
  <link rel="stylesheet" href="styles/modules.css">
  <script type="module" src="scripts/modules.mjs"></script>
</head>
<body>
  <main>
    <h1 id="courseName"></h1>
    <h2 id="courseCode"></h2>
    <div id="enrollment">
      <label for="sectionNumber">Choose a section:</label>
      <select id="sectionNumber">
        <option value="0" disabled selected>--</option>
      </select>
      <button id="enrollStudent" type="button">Enroll a Student</button>
      <button id="dropStudent" type="button">Drop a Student</button>
    </div>
    <table>
      <thead>
        <tr>
          <th scope="col">Section</th>
          <th scope="col">Enrolled</th>
          <th scope="col">Instructor</th>
        </tr>
      </thead>
      <tbody id="sections"></tbody>
    </table>
  </main>
</body>
</html>
